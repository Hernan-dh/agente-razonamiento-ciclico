[tool.poetry]
name = "agente-razonamiento-ciclico"
version = "0.1.0"
description = "Agente ReAct con LangGraph y memoria SQLite"
authors = ["Alumno <alumno@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
langchain-openai = "^0.3.0"
langgraph = ">=0.2.0"
langgraph-checkpoint-sqlite = "^2.0.0"
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
